---

experiment:
  seed: 42
  save_dir: ./prj/exp_tracking_bayes
  save_model: tracking_bayes_mc
  cpu: True
  ckpt_file: best_chkp.tf

dataset:
  # NOTE: "tracking" uses a reproducible SYNTHETIC stand-in (the original
  # Particle Tracking dataset is not public). See the "tracking" branch in
  # tasks/keras/dataset.py to swap in real data.
  name: tracking
  data: <dict>
  mean: 0.0
  std: 1.0

model:
  original: <obj>
  logic: <obj>
  name: tracking
  is_quant: false
  dropout_rate: 0.4
  p_rate: 0.05
  scale_factor: 1.0        # 1.0 == benchmark 14->32->32->32->3 (~2,691 params)
  dropout_type: mc
  num_bayes_layer: 3

# flops base = 2 x MACs = 2 x (14*32 + 32*32 + 32*32 + 32*3) = 5184 at
# scale_factor=1.0; a normalisation reference only.

