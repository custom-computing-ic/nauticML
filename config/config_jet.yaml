---

experiment:
  seed: 42
  save_dir: ./prj/exp_jet_bayes
  save_model: jet_bayes_mc
  cpu: True
  ckpt_file: best_chkp.tf

dataset:
  name: jets
  data: <dict>
  # Features are StandardScaler-normalised (mean 0, std 1), so the APE noise
  # generator in eval.py draws from N(0, 1) to match the input distribution.
  mean: 0.0
  std: 1.0

model:
  original: <obj>
  logic: <obj>
  name: jet
  is_quant: false
  dropout_rate: 0.4
  p_rate: 0.05
  scale_factor: 1.0        # 1.0 == canonical 16->64->32->32->5 (~4,389 params)
  dropout_type: mc
  num_bayes_layer: 3

# flops base below is the float-op count of the scale_factor=1.0 model
# (2 x MACs = 2 x (16*64 + 64*32 + 32*32 + 32*5) = 8512). It is only a
# normalisation reference for the strategy scores.

