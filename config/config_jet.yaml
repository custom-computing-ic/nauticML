strategy:
  strategies: [ S7 ]
  curr_strategy: <int>
  curr_results: ((bayes_opt.summary))

  terminate_strategies: <bool>
  results: <dict>
  save_dir: ((experiment.save_dir))

bayes_opt:
  iteration: <int>
  terminate: <bool>
  engine: <obj>
  score: <float>
  summary: <list>

  curr_strategy: <obj>

  control:
    params: dict
    suggests: dict

  num_iter: 100
  seed: ((experiment.seed))
  tunable:
    dropout_rate:
       value: ((model.dropout_rate))
       space: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.80, 0.85, 0.90, 0.95]
    p_rate:
       value: ((model.p_rate))
       space:  [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.80, 0.85, 0.90, 0.95]
    num_bayes_layer:
       value: ((model.num_bayes_layer))
       space: [1, 2, 3]
    scale_factor:
       value: ((model.scale_factor))
       space: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.80, 0.85, 0.90, 0.95, 1.0]

  metrics:
    accuracy: ((eval.accuracy))
    ece: ((eval.ece))
    ape: ((eval.ape))
    flops: ((eval.flops))
    power: ((eval.power))
    energy: ((eval.energy))

train:
  optimizer: <obj>
  id: ((bayes_opt.iteration))
  # The hls4ml tutorial's literal recipe is Adam @ 1e-4 / 10 epochs, but that
  # underfits here (the tutorial baseline has no MC-dropout and relies on a LR
  # scheduler). Tuned for convergence: lr 1e-3, 30 epochs. Cite the tutorial
  # numbers as the baseline; these are the trained settings.
  num_epoch: 5
  batch_size: 1024
  learning_rate: 0.001
  validation_split: 0.25

eval:
  ece: <float>
  ape: <float>
  accuracy: <float>
  flops: <float>
  power: <float>
  energy: <float>

  cached: <bool>

  mc_samples: 5
  num_eval_images: 200
  num_bins: 10

# hls4ml energy estimation config
hls4ml:
  num_mc_samples: ((eval.mc_samples))
  hls_project_dir: <str>

  max_ii: <int>
  model_params: <int>
  # Power proxy mode. Unset -> run the full Vivado power estimator. Set to one
  # of ff | params | model_proxy to skip Vivado after HLS synthesis and return a
  # cheap proxy instead. model_proxy keeps the DSE fast.
  proxy: "model_proxy"

  vivado_timeout: 86400

  power_mode:
    mode: "saif_synth"
    num_samples: 6

  hls_config:
    precision: "ap_fixed<16,6>"
    strategy: "Latency"               # Latency + io_parallel for small dense nets
    io_type: "io_parallel"            # fully-connected -> parallel IO (no streaming)
    clock_period: 5                   # ns (~200 MHz)
    fpga_part: "xczu7ev-ffvc1156-2-e"
    # RF=1 fully unrolls the tiny dense layers (the hls4ml jet-tagger default).
    # Pinned flat across DSE iterations so max(RF) stays constant.
    # reuse_factor: 1

reporter:
  log:
    - bayes_opt.iteration
    - dropout_rate_list
    - p_rate
    - num_bayes_layer
    - scale_factor
    - accuracy
    - flops
    - ece
    - ape
    - score
    - power
    - energy
