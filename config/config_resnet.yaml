---

experiment:
  seed: 42
  save_dir: ./prj/exp_cifar_bayes_resnet
  save_model: cifar_resnet_tmp_3bayeslayer_mc
  # cpu: True
  gpus: [2]
  ckpt_file: best_chkp.tf

dataset:
  name: cifar10
  data: <dict>
  mean: 0.0
  std: 1.0

model:
  original: <obj>
  logic: <obj>
  name: resnet
  is_quant: false
  dropout_rate: 0.4
  p_rate: 0.05
  scale_factor: 0.3
  dropout_type: mc
  num_bayes_layer: 3

# NOTE: introduce typing so that we can type dictionaries too
S1:
  accuracy:
    weight: 0.25
    base: 0.99
  ece:
    weight: -0.25
    base: 0.03
  ape:
    weight: 0.25
    base: 1.5
  flops:
    weight: -0.25
    base: 5340192
  power:
    weight: 0.00
    base: 2.0
  energy:
    weight: 0.00
    base: 1000000

  top_n: 3
  # special metric calculated from the other metrics
  top_metric: score

  name: Balance

S2:
  accuracy:
    weight: 0.75
    base: 0.92
  ece:
    weight: 0.00
    base: 0.09
  ape:
    weight: 0.00
    base: 1.8
  flops:
    weight: -0.25
    base: 1112422588
  power:
    weight: 0.00
    base: 2.0
  energy:
    weight: 0.00
    base: 1000000

  top_n: 1
  top_metric: flops

  name: Opt-Efficiency

S6:
  accuracy:
    weight: 0.166
    base: 0.99
  ece:
    weight: -0.166
    base: 0.03
  ape:
    weight: 0.166
    base: 1.5
  flops:
    weight: -0.166
    base: 5340192
  power:
    weight: -0.166
    base: 1.0
  energy:
    weight: -0.166
    base: 500000

  top_n: 3
  name: Opt-Balanced

S7:
  accuracy:
    weight: 0.00
    base: 0.92
    min: 0.85
  ece:
    weight: 0.00
    base: 0.09
  ape:
    weight: 0.00
    base: 1.8
  flops:
    weight: 0.00
    base: 1112422588
  power:
    weight: -1.00
    base: 2.0
  energy:
    weight: 0.00
    base: 1000000

  top_n: 1
  name: Opt-Power

S8:
  accuracy:
    weight: 0.00
    base: 0.92
    min: 0.85
  ece:
    weight: 0.00
    base: 0.09
  ape:
    weight: 0.00
    base: 1.8
  flops:
    weight: 0.00
    base: 1112422588
  power:
    weight: 0.00
    base: 2.0
  # energy = dyn_power × max_ii × num_mc_samples (W·cycles per prediction).
  # Base ~1M is the order of magnitude for ResNet18 at scale_factor=0.3,
  # RF=4500, mc_samples=10.
  energy:
    weight: -1.00
    base: 1000000

  top_n: 1
  name: Opt-Energy

S9:
  accuracy:
    weight: 0.20
    base: 0.99
    min: 0.95
  ece:
    weight: -0.20
    base: 0.03
  ape:
    weight: 0.20
    base: 1.5
  flops:
    weight: -0.20
    base: 5340192
  power:
    weight: -0.20
    base: 1.0
  # energy = dyn_power × max_ii × num_mc_samples (W·cycles per prediction).
  # Proportional to joules at fixed clock_period. Base ~500k is the order
  # of magnitude for LeNet at scale_factor=0.3, RF=500, mc_samples=5.
  energy:
    weight: 0.00
    base: 500000

  top_n: 3
  name: Opt-Power-Balanced


strategy:
  strategies: [ S6 ]
  curr_strategy: <int>
  curr_results: ((bayes_opt.summary))

  terminate_strategies: <bool>
  results: <dict>
  save_dir: ((experiment.save_dir))


bayes_opt:
  iteration: <int>
  terminate: <bool>
  engine: <obj>
  score: <float>
  summary: <list>

  curr_strategy: <obj>

  control:
    params: dict
    suggests: dict

  num_iter: 15
  seed: ((experiment.seed))
  tunable:
    dropout_rate:
       value: ((model.dropout_rate))
       space: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.80, 0.85, 0.90, 0.95]
      #  space: [0.1, 0.2, 0.3, 0.4]
    p_rate:
       value: ((model.p_rate))
       space:  [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.80, 0.85, 0.90, 0.95]
      #  space: [0.0, 0.1, 0.2]
    num_bayes_layer:
       value: ((model.num_bayes_layer))
       space: [1, 2, 3]
    scale_factor:
       value: ((model.scale_factor))
      #  space: [0.5, 1.0, 1.5]
       space: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.80, 0.85, 0.90, 0.95]

  metrics:
    accuracy: ((eval.accuracy))
    ece: ((eval.ece))
    ape: ((eval.ape))
    flops: ((eval.flops))
    power: ((eval.power))
    energy: ((eval.energy))

train:
  optimizer: <obj>
  id: ((bayes_opt.iteration))
  num_epoch: 3
  batch_size: 128
  learning_rate: 0.01
  validation_split: 0.1

eval:
  ece: <float>
  ape: <float>
  accuracy: <float>
  flops: <float>
  power: <float>
  energy: <float>

  mc_samples: 10
  num_eval_images: 200
  num_bins: 10

# hls4ml energy estimation config
hls4ml:
  num_mc_samples: ((eval.mc_samples))
  hls_project_dir: <str>
  max_ii: <int>

  vivado_timeout: 86400

  power_mode: # vectorless, saif_synth, saif_impl in order of refined accuracy. saif modes need num_samples
    mode: "saif_synth"
    num_samples: 6

  hls_config:
    precision: "ap_fixed<16,6>"       # HEART 2025 §5.1: 16-bit, 6 integer bits
    strategy: "Resource"              # Resource or Latency (wa-hls4ml §2.1.1)
    io_type: "io_stream"              # io_stream for CNNs (wa-hls4ml §2.1.1)
    clock_period: 5                   # ns (HEART 2025 Table 2: 5ns = ~200MHz)
    fpga_part: "xczu7ev-ffvc1156-2-e" # Kintex UltraScale KU115 (HEART 2025 Table 5)
    # Pinned flat across the worst Dense/Conv layer so max(RF) stays constant
    # across DSE iterations. Must be >= every layer's min: at scale_factor=0.95,
    # the deepest ResNet18 block (8 × int(64*0.95) channels) needs
    # >= 3*3*8*60 = 4320 for the io_stream Resource constraint. 4500 covers
    # up to scale_factor=0.95 with a small margin.
    reuse_factor: 4500


reporter:
  log:
    - bayes_opt.iteration
    - dropout_rate_list
    - p_rate
    - num_bayes_layer
    - scale_factor
    - accuracy
    - flops
    - ece
    - ape
    - score
    - power
    - energy
